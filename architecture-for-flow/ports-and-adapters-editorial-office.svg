<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #1f2937; }
      .subtitle { font: 500 13px Arial, sans-serif; fill: #374151; }
      .label { font: 700 15px Arial, sans-serif; fill: #111827; }
      .text  { font: 500 13px Arial, sans-serif; fill: #111827; }
      .small { font: 500 11px Arial, sans-serif; fill: #374151; }
      .core  { fill: #fcd34d; stroke: #92400e; stroke-width: 2; }
      .port  { fill: #ffffff; stroke: #92400e; stroke-width: 2; }
      .adapter-in { fill: #60a5fa; stroke: #1e3a8a; stroke-width: 1.5; rx: 10; ry: 10; }
      .adapter-out { fill: #86efac; stroke: #14532d; stroke-width: 1.5; rx: 10; ry: 10; }
      .arrow { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#f8fafc"/>

  <text x="450" y="42" text-anchor="middle" class="title">Ports and Adapters: the Editorial Office</text>
  <text x="450" y="64" text-anchor="middle" class="subtitle">The office (core) only ever talks through its own doors (ports) — whatever is plugged in outside can change freely</text>

  <!-- Core hexagon (approximated as octagon for simplicity) -->
  <polygon class="core" points="450,150 560,190 590,300 560,410 450,450 340,410 310,300 340,190" />
  <text x="450" y="270" text-anchor="middle" class="label">Editorial Office</text>
  <text x="450" y="292" text-anchor="middle" class="text">(Submission, Author,</text>
  <text x="450" y="310" text-anchor="middle" class="text">Review, business rules)</text>
  <text x="450" y="335" text-anchor="middle" class="small">"2+ reviews before acceptance"</text>
  <text x="450" y="352" text-anchor="middle" class="small">"corresponding author listed first"</text>

  <!-- Inbound port -->
  <rect class="port" x="300" y="270" width="20" height="60" rx="4"/>
  <text x="250" y="255" text-anchor="middle" class="small">Inbound port:</text>
  <text x="250" y="270" text-anchor="middle" class="small">"a manuscript</text>
  <text x="250" y="285" text-anchor="middle" class="small">was submitted"</text>

  <!-- Outbound port -->
  <rect class="port" x="580" y="270" width="20" height="60" rx="4"/>
  <text x="650" y="255" text-anchor="middle" class="small">Outbound port:</text>
  <text x="650" y="270" text-anchor="middle" class="small">"notify that a</text>
  <text x="650" y="285" text-anchor="middle" class="small">decision was made"</text>

  <!-- Inbound adapters (left side) -->
  <rect class="adapter-in" x="40" y="90" width="200" height="60"/>
  <text x="140" y="115" text-anchor="middle" class="label" fill="#fff">Web submission portal</text>
  <text x="140" y="135" text-anchor="middle" class="small" fill="#eff6ff">turns a form into "submitted"</text>
  <path class="arrow" d="M240,120 C280,140 290,180 300,270" />

  <rect class="adapter-in" x="40" y="180" width="200" height="60"/>
  <text x="140" y="205" text-anchor="middle" class="label" fill="#fff">Bulk import (migration)</text>
  <text x="140" y="225" text-anchor="middle" class="small" fill="#eff6ff">legacy platform migration</text>
  <path class="arrow" d="M240,210 C270,230 290,260 300,290" />

  <rect class="adapter-in" x="40" y="270" width="200" height="60"/>
  <text x="140" y="295" text-anchor="middle" class="label" fill="#fff">Test / rehearsal adapter</text>
  <text x="140" y="315" text-anchor="middle" class="small" fill="#eff6ff">simulate submissions in QA</text>
  <path class="arrow" d="M240,300 L300,300" />

  <!-- Outbound adapters (right side) -->
  <rect class="adapter-out" x="660" y="90" width="200" height="60"/>
  <text x="760" y="115" text-anchor="middle" class="label">Email notifications</text>
  <text x="760" y="135" text-anchor="middle" class="small">sends decision to author</text>
  <path class="arrow" d="M600,290 C650,250 680,180 700,150" />

  <rect class="adapter-out" x="660" y="180" width="200" height="60"/>
  <text x="760" y="205" text-anchor="middle" class="label">Production system feed</text>
  <text x="760" y="225" text-anchor="middle" class="small">starts typesetting</text>
  <path class="arrow" d="M600,300 C630,270 660,240 700,225" />

  <rect class="adapter-out" x="660" y="270" width="200" height="60"/>
  <text x="760" y="295" text-anchor="middle" class="label">Metrics / reporting</text>
  <text x="760" y="315" text-anchor="middle" class="small">editorial turnaround stats</text>
  <path class="arrow" d="M600,310 L660,300" />

  <!-- Legend / caption box -->
  <rect x="150" y="480" width="600" height="180" rx="14" ry="14" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="170" y="510" class="label">Reading the picture</text>
  <text x="170" y="535" class="text">• The hexagon (office) never sees "a web form" or "an email" — only</text>
  <text x="185" y="553" class="text">its own ports: "submitted", "notify decision".</text>
  <text x="170" y="578" class="text">• Blue adapters push work IN through inbound ports.</text>
  <text x="170" y="601" class="text">• Green adapters carry work OUT through outbound ports.</text>
  <text x="170" y="626" class="text">• Any adapter can be swapped, added, or removed without touching</text>
  <text x="185" y="644" class="text">the office's rules — that's the whole point.</text>
</svg>
