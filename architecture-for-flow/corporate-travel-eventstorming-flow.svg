<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 500 14px Arial, sans-serif; fill: #374151; }
      .label { font: 700 14px Arial, sans-serif; fill: #111827; }
      .text { font: 500 12px Arial, sans-serif; fill: #111827; }
      .small { font: 500 11px Arial, sans-serif; fill: #374151; }
      .card { rx: 12; ry: 12; stroke: #374151; stroke-width: 1.5; }
      .arrow { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="780" fill="#f8fafc"/>

  <text x="800" y="44" text-anchor="middle" class="title">EventStorming Flow: Corporate Travel Booking</text>
  <text x="800" y="68" text-anchor="middle" class="subtitle">Budget policy decides whether a trip is auto-approved or routed for manager approval</text>

  <!-- Main flow row -->
  <!-- 1 Command -->
  <rect class="card" x="40" y="160" width="220" height="100" fill="#60a5fa"/>
  <text class="label" x="56" y="188">Command</text>
  <text class="text" x="56" y="212">Submit Trip Request</text>
  <text class="small" x="56" y="234">Employee enters itinerary + cost</text>

  <!-- 2 Domain event -->
  <rect class="card" x="300" y="160" width="220" height="100" fill="#fb923c"/>
  <text class="label" x="316" y="188">Domain Event</text>
  <text class="text" x="316" y="212">Trip Request Submitted</text>
  <text class="small" x="316" y="234">Request captured by system</text>

  <!-- 3 Policy -->
  <rect class="card" x="560" y="160" width="240" height="100" fill="#c084fc"/>
  <text class="label" x="576" y="188">Policy</text>
  <text class="text" x="576" y="212">Check budget threshold</text>
  <text class="small" x="576" y="234">if cost &lt;= policy limit: auto-approve</text>

  <!-- 4 Command -->
  <rect class="card" x="840" y="110" width="240" height="100" fill="#60a5fa"/>
  <text class="label" x="856" y="138">Command (Path A)</text>
  <text class="text" x="856" y="162">Auto-Approve Trip</text>
  <text class="small" x="856" y="184">Low-cost trip</text>

  <!-- 5 Event -->
  <rect class="card" x="1120" y="110" width="220" height="100" fill="#fb923c"/>
  <text class="label" x="1136" y="138">Domain Event</text>
  <text class="text" x="1136" y="162">Trip Auto-Approved</text>
  <text class="small" x="1136" y="184">No manager action needed</text>

  <!-- 6 Command -->
  <rect class="card" x="840" y="250" width="240" height="100" fill="#60a5fa"/>
  <text class="label" x="856" y="278">Command (Path B)</text>
  <text class="text" x="856" y="302">Request Manager Approval</text>
  <text class="small" x="856" y="324">High-cost trip</text>

  <!-- 7 Event -->
  <rect class="card" x="1120" y="250" width="220" height="100" fill="#fb923c"/>
  <text class="label" x="1136" y="278">Domain Event</text>
  <text class="text" x="1136" y="302">Approval Requested</text>
  <text class="small" x="1136" y="324">Pending manager decision</text>

  <!-- 8 Actor + Command -->
  <rect class="card" x="1380" y="250" width="180" height="100" fill="#f9a8d4"/>
  <text class="label" x="1396" y="278">Actor</text>
  <text class="text" x="1396" y="302">Manager Reviews</text>
  <text class="small" x="1396" y="324">Approves / rejects</text>

  <rect class="card" x="1380" y="400" width="180" height="100" fill="#60a5fa"/>
  <text class="label" x="1396" y="428">Command</text>
  <text class="text" x="1396" y="452">Approve Trip</text>
  <text class="small" x="1396" y="474">or Reject Trip</text>

  <!-- 9 Events -->
  <rect class="card" x="1120" y="400" width="220" height="100" fill="#fb923c"/>
  <text class="label" x="1136" y="428">Domain Event</text>
  <text class="text" x="1136" y="452">Trip Approved</text>
  <text class="small" x="1136" y="474">Ready to ticket</text>

  <rect class="card" x="1120" y="540" width="220" height="100" fill="#fb923c"/>
  <text class="label" x="1136" y="568">Domain Event</text>
  <text class="text" x="1136" y="592">Trip Rejected</text>
  <text class="small" x="1136" y="614">Notify employee</text>

  <!-- Read models -->
  <rect class="card" x="820" y="540" width="260" height="100" fill="#86efac"/>
  <text class="label" x="836" y="568">Read Model</text>
  <text class="text" x="836" y="592">Travel Request Status View</text>
  <text class="small" x="836" y="614">Draft / Pending / Approved / Rejected</text>

  <!-- Aggregate -->
  <rect class="card" x="560" y="400" width="240" height="100" fill="#fcd34d"/>
  <text class="label" x="576" y="428">Aggregate</text>
  <text class="text" x="576" y="452">Travel Request</text>
  <text class="small" x="576" y="474">enforces lifecycle and rules</text>

  <!-- External system -->
  <rect class="card" x="300" y="540" width="220" height="100" fill="#d1d5db"/>
  <text class="label" x="316" y="568">External System</text>
  <text class="text" x="316" y="592">Corporate Policy Service</text>
  <text class="small" x="316" y="614">budget per dept / role</text>

  <!-- Hotspot -->
  <rect class="card" x="40" y="540" width="220" height="100" fill="#ef4444"/>
  <text class="label" x="56" y="568" fill="#ffffff">Hotspot / Question</text>
  <text class="text" x="56" y="592" fill="#ffffff">What about urgent exceptions?</text>
  <text class="small" x="56" y="614" fill="#fee2e2">Override + audit trail needed?</text>

  <!-- Arrows -->
  <line class="arrow" x1="260" y1="210" x2="300" y2="210"/>
  <line class="arrow" x1="520" y1="210" x2="560" y2="210"/>
  <line class="arrow" x1="800" y1="200" x2="840" y2="160"/>
  <line class="arrow" x1="800" y1="220" x2="840" y2="300"/>
  <line class="arrow" x1="1080" y1="160" x2="1120" y2="160"/>
  <line class="arrow" x1="1080" y1="300" x2="1120" y2="300"/>
  <line class="arrow" x1="1340" y1="300" x2="1380" y2="300"/>
  <line class="arrow" x1="1470" y1="350" x2="1470" y2="400"/>
  <line class="arrow" x1="1380" y1="450" x2="1340" y2="450"/>
  <line class="arrow" x1="1380" y1="470" x2="1340" y2="590"/>
  <line class="arrow dashed" x1="1120" y1="450" x2="1080" y2="570"/>
  <line class="arrow dashed" x1="1120" y1="590" x2="1080" y2="590"/>
  <line class="arrow dashed" x1="560" y1="450" x2="800" y2="300"/>
  <line class="arrow dashed" x1="520" y1="590" x2="560" y2="450"/>
  <line class="arrow dashed" x1="300" y1="590" x2="560" y2="210"/>

  <!-- Legend -->
  <text x="40" y="710" class="small">Color key: Orange=Event, Blue=Command, Purple=Policy, Yellow=Aggregate, Green=Read Model, Pink=Actor, Gray=External, Red=Hotspot</text>
</svg>
